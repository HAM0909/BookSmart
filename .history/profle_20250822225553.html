<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Profil Adhérent</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-8">

<div class="container mx-auto">
    <h1 class="text-3xl font-bold mb-6">Mon Profil</h1>

    <ul class="nav nav-tabs mb-4" id="profileTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="info-tab" data-bs-toggle="tab" data-bs-target="#info" type="button">Infos personnelles</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="emprunts-tab" data-bs-toggle="tab" data-bs-target="#emprunts" type="button">Mes emprunts</button>
        </li>
    </ul>

    <div class="tab-content" id="profileTabsContent">
        
        <div class="tab-pane fade show active" id="info" role="tabpanel">
            <div class="bg-white p-6 rounded shadow">
                <p><strong>Nom :</strong> John Doe</p>
                <p><strong>Email :</strong> john.doe@example.com</p>
                <p><strong>Rôle :</strong> Adhérent</p>
            </div>
        </div>

        <!-- Mes emprunts -->
        <div class="tab-pane fade" id="emprunts" role="tabpanel">
            <div class="bg-white p-6 rounded shadow">
                <h2 class="text-2xl font-semibold mb-4">Mes emprunts</h2>
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Titre</th>
                            <th>Date emprunt</th>
                            <th>Date retour prévue</th>
                            <th>Date retour effectif</th>
                            <th>Statut</th>
                        </tr>
                    </thead>
                    <tbody id="empruntsBody">
                        <!-- Les emprunts seront injectés ici par JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
const adherentId = 1; // Remplacer par l'ID réel de l'utilisateur connecté

async function fetchEmprunts() {
    try {
        const res = await fetch(`/api/mes-emprunts?adherent_id=${adherentId}`);
        if (!res.ok) throw new Error("Erreur API");
        const emprunts = await res.json();
        return emprunts;
    } catch (err) {
        console.error(err);
        return [];
    }
}

function displayEmprunts(emprunts) {
    const tbody = document.getElementById("empruntsBody");
    tbody.innerHTML = "";

    emprunts.forEach(e => {
        const tr = document.createElement("tr");

        // Couleur selon le statut
        let statutClass = "";
        if (e.statut === "en_retard") statutClass = "text-danger font-bold";
        else if (e.statut === "en_cours") statutClass = "text-warning";
        else if (e.statut === "rendu") statutClass = "text-success";

        tr.innerHTML = `
            <td>${e.titre}</td>
            <td>${new Date(e.date_emprunt).toLocaleDateString()}</td>
            <td>${new Date(e.date_retour_prevue).toLocaleDateString()}</td>
            <td>${e.date_retour_effectif ? new Date(e.date_retour_effectif).toLocaleDateString() : "-"}</td>
            <td class="${statutClass}">${e.statut.replace("_"," ")}</td>
        `;
        tbody.appendChild(tr);
    });
}

// Affichage initial
fetchEmprunts().then(displayEmprunts);
</script>

<!-- Bootstrap JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
