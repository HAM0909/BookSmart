<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Réserver un livre</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6 font-sans">

    <!-- Titre principal -->
    <h1 class="text-3xl text-center mb-8 text-blue-700">Réserver un livre</h1>

    <!-- Conteneur du formulaire -->
    <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow border border-gray-200">

        <!-- Champ : ID du livre -->
        <label class="block text-sm font-medium text-gray-700 mb-2">
            ID du livre
        </label>
        <input type="number" id="id_livre" value="1"
               class="w-full border border-gray-300 rounded px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">

        <!-- Champ : ID de l'adhérent -->
        <label class="block text-sm font-medium text-gray-700 mb-2">
            ID de l'adhérent
        </label>
        <input type="number" id="id_adherent" value="1"
               class="w-full border border-gray-300 rounded px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">

        <!-- Bouton "Réserver" -->
        <button onclick="reserver()"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded font-medium transition duration-200">
            Réserver
        </button>

    </div>

    <!-- Script JavaScript -->
    <script>
        function reserver() {
            // 1. Récupérer les valeurs des champs
            const id_livre = document.getElementById("id_livre").value;
            const id_adherent = document.getElementById("id_adherent").value;

            // 2. Vérifier que les champs ne sont pas vides
            if (!id_livre || !id_adherent) {
                alert("❌ Veuillez remplir les deux champs.");
                return;
            }

            // 3. Convertir en nombre entier
            const id_livre_num = parseInt(id_livre);
            const id_adherent_num = parseInt(id_adherent);

            // 4. Envoyer la requête à l'API
            fetch('/api/reservations', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    id_livre: id_livre_num,
                    id_adherent: id_adherent_num
                })
            })
            .then(response => {
                // Vérifie si la réponse est OK (200)
                if (!response.ok) {
                    throw new Error("Erreur serveur");
                }
                return response.json();
            })
            .then(data => {
                // Afficher le message
                alert(data.message);

                // Si succès, changer le bouton
                const btn = document.querySelector("button");
                if (data.success) {
                    btn.textContent = "✅ Réserve effectuée";
                    btn.classList.add("bg-green-500");
                    btn.classList.remove("bg-blue-600");
                }
            })
            .catch(error => {
                console.error("Erreur :", error);
                alert("⚠️ Impossible de contacter le serveur. Vérifiez que FastAPI tourne.");
            });
        }
    </script>

</body>
</html>
