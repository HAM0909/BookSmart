<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Home - Bibliothèque</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

<header class="bg-blue-600 text-white p-4 flex flex-col sm:flex-row justify-between items-center gap-2">
    <h1 class="text-2xl font-bold">Bibliothèque</h1>
    <input id="searchInput" type="text" placeholder="Rechercher un livre..." class="px-3 py-2 rounded w-full sm:w-auto">
</header>

<main class="p-4 container mx-auto">
    <!-- Graphique Disponibilité -->
    <div class="bg-white p-4 rounded shadow mb-6">
        <h2 class="text-xl font-semibold mb-2">Répartition des livres</h2>
        <canvas id="availabilityChart" height="150"></canvas>
    </div>

    <!-- Grille des livres -->
    <div id="booksGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <!-- Les livres seront injectés ici -->
    </div>
    <p id="errorMsg" class="text-red-600 mt-4 text-center"></p>
</main>

<script>
let currentUserId = null;
let availabilityChart = null;

// Récupérer l'utilisateur connecté
async function fetchCurrentUser() {
    try {
        const res = await fetch("/api/me");
        const data = await res.json();
        currentUserId = data.id;
    } catch {
        currentUserId = 1; // fallback
    }
}

// Récupérer les livres depuis l'API
async function fetchBooks(search="") {
    try {
        let url = "/api/livres";
        if (search) url += `?search=${encodeURIComponent(search)}`;
        const res = await fetch(url);
        return await res.json();
    } catch {
        document.getElementById("errorMsg").textContent = "Erreur réseau lors du chargement des livres.";
        return [];
    }
}

// Réserver un livre
async function reserveBook(bookId) {
    if (!currentUserId) { alert("Utilisateur non connecté !"); return; }
    try {
        const res = await fetch("/api/reservations", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id_livre: bookId, id_adherent: currentUserId })
        });
        const data = await res.json();
        alert(data.msg || "Réservation réussie !");
        displayBooks(document.getElementById("searchInput").value);
    } catch { alert("Erreur réseau lors de la réservation."); }
}

// Affichage des livres
async function displayBooks(search="") {
    const books = await fetchBooks(search);
    const grid = document.getElementById("booksGrid");
    grid.innerHTML = "";
    document.getElementById("errorMsg").textContent = "";

    if (books.length === 0) {
        grid.innerHTML = `<p class="col-span-full text-center text-gray-500 mt-4">Aucun livre trouvé</p>`;
        updateChart([], []);
        return;
    }

    let disponibles = 0, reserves = 0;

    books.forEach(book => {
        const card = document.createElement("div");
        card.className = "bg-white rounded-lg shadow p-4 flex flex-col items-center mb-2";

        card.innerHTML = `
            <img src="${book.image_url || 'https://via.placeholder.com/150'}" 
                 alt="${book.titre}" class="w-32 h-40 object-cover mb-3 rounded">
            <div class="font-semibold text-center mb-2">${book.titre}</div>
            <div class="mb-3 text-sm ${book.disponibilite ? 'text-green-600' : 'text-red-600'}">
                ${book.disponibilite ? 'Disponible' : 'Réservé'}
            </div>
        `;

        const btn = document.createElement("button");
        btn.textContent = "Réserver";
        btn.className = `px-3 py-1 rounded w-full ${book.disponibilite ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-gray-400 text-gray-200 cursor-not-allowed'}`;
        btn.disabled = !book.disponibilite;
        btn.onclick = () => reserveBook(book.id);

        card.appendChild(btn);
        grid.appendChild(card);

        if (book.disponibilite) disponibles++; else reserves++;
    });

    updateChart(disponibles, reserves);
}

// Mettre à jour le graphique
function updateChart(disponibles, reserves) {
    const ctx = document.getElementById('availabilityChart').getContext('2d');

    const data = {
        labels: ['Disponibles', 'Réservés'],
        datasets: [{
            label: 'Nombre de livres',
            data: [disponibles, reserves],
            backgroundColor: ['#22c55e','#ef4444']
        }]
    };

    if (availabilityChart) {
        availabilityChart.data = data;
        availabilityChart.update();
    } else {
        availabilityChart = new Chart(ctx, {
            type: 'doughnut',
            data: data,
            options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
        });
    }
}


document.getElementById("searchInput").addEventListener("input", e => {
    displayBooks(e.target.value);
});


async function init() {
    await fetchCurrentUser();
    displayBooks();
}

init();
</script>

</body>
</html>
