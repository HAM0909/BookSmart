<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion des emprunts</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">

    <h1 class="text-2xl font-bold mb-6">Gestion des Emprunts</h1>

    <!-- Section : Ajouter un emprunt -->
    <div class="bg-white p-6 rounded shadow mb-6">
        <h2 class="text-xl font-semibold mb-4">Ajouter un emprunt</h2>
        <div class="grid grid-cols-3 gap-4">
            <select id="adherentSelect" class="border p-2 rounded">
                <option value="">Choisir un adhérent</option>
            </select>
            <select id="livreSelect" class="border p-2 rounded">
                <option value="">Choisir un livre</option>
            </select>
            <button id="addEmpruntBtn" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                Enregistrer l'emprunt
            </button>
        </div>
        <p id="empruntMsg" class="mt-2 text-green-600"></p>
    </div>

    <!-- Section : Enregistrer un retour -->
    <div class="bg-white p-6 rounded shadow">
        <h2 class="text-xl font-semibold mb-4">Enregistrer un retour</h2>
        <select id="empruntSelect" class="border p-2 rounded w-full mb-2">
            <option value="">Choisir un emprunt en cours</option>
        </select>
        <button id="returnBtn" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
            Enregistrer le retour
        </button>
        <p id="returnMsg" class="mt-2 text-green-600"></p>
    </div>

<script>
async function fetchAdherents() {
    const res = await fetch("/api/adherents");
    const data = await res.json();
    const select = document.getElementById("adherentSelect");
    data.forEach(a => {
        const option = document.createElement("option");
        option.value = a.id;
        option.textContent = a.nom;
        select.appendChild(option);
    });
}

async function fetchLivres() {
    const res = await fetch("/api/livres");
    const data = await res.json();
    const select = document.getElementById("livreSelect");
    data.forEach(l => {
        if (l.disponibilite) {
            const option = document.createElement("option");
            option.value = l.id;
            option.textContent = l.titre;
            select.appendChild(option);
        }
    });
}

async function fetchEmpruntsEnCours() {
    const res = await fetch("/api/emprunts-en-cours");
    const data = await res.json();
    const select = document.getElementById("empruntSelect");
    select.innerHTML = '<option value="">Choisir un emprunt en cours</option>';
    data.forEach(e => {
        const option = document.createElement("option");
        option.value = e.id;
        option.textContent = `${e.titre} - ${e.adherent_nom}`;
        select.appendChild(option);
    });
}

// Ajouter un emprunt
document.getElementById("addEmpruntBtn").addEventListener("click", async () => {
    const id_adherent = document.getElementById("adherentSelect").value;
    const id_livre = document.getElementById("livreSelect").value;
    if (!id_adherent || !id_livre) return alert("Veuillez sélectionner un adhérent et un livre.");
    const res = await fetch("/api/emprunts", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({id_adherent, id_livre})
    });
    const data = await res.json();
    document.getElementById("empruntMsg").textContent = data.msg;
    fetchEmpruntsEnCours();
    fetchLivres();
});

// Enregistrer un retour
document.getElementById("returnBtn").addEventListener("click", async () => {
    const id_emprunt = document.getElementById("empruntSelect").value;
    if (!id_emprunt) return alert("Veuillez sélectionner un emprunt.");
    const res = await fetch("/api/retours", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({id_emprunt})
    });
    const data = await res.json();
    document.getElementById("returnMsg").textContent = data.msg;
    fetchEmpruntsEnCours();
    fetchLivres();
});

// Initialisation
fetchAdherents();
fetchLivres();
fetchEmpruntsEnCours();

</script>
</body>
</html>
