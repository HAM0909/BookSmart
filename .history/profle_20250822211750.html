<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Profil - Mes Emprunts</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

<header class="bg-blue-600 text-white p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold">Mon Profil</h1>
</header>

<main class="p-4">
    <section class="mb-6">
        <h2 class="text-lg font-semibold mb-2">Informations de l'adhérent</h2>
        <div id="userInfo" class="bg-white shadow rounded p-4">
            <!-- Infos utilisateur insérées par JS -->
        </div>
    </section>

    <section>
        <h2 class="text-lg font-semibold mb-2">Mes Emprunts</h2>
        <div class="bg-white shadow rounded p-4">
            <table class="w-full text-left table-auto border-collapse">
                <thead>
                    <tr class="bg-gray-200">
                        <th class="px-4 py-2">Titre</th>
                        <th class="px-4 py-2">Date d'emprunt</th>
                        <th class="px-4 py-2">Date de retour prévue</th>
                        <th class="px-4 py-2">Statut</th>
                    </tr>
                </thead>
                <tbody id="empruntsTable">
                    <!-- Les emprunts seront insérés par JS -->
                </tbody>
            </table>
        </div>
    </section>
</main>

<script>
let currentUserId = null;

// Récupérer l'utilisateur connecté
async function fetchCurrentUser() {
    try {
        const response = await fetch("/api/me");
        const data = await response.json();
        currentUserId = data.id;
        displayUserInfo(data);
    } catch (err) {
        console.error("Erreur fetchCurrentUser:", err);
        currentUserId = 1; // valeur par défaut pour test
    }
}

// Afficher les infos de l'utilisateur
function displayUserInfo(user) {
    const div = document.getElementById("userInfo");
    div.innerHTML = `
        <p><strong>Nom :</strong> ${user.nom}</p>
        <p><strong>Email :</strong> ${user.email}</p>
        <p><strong>Rôle :</strong> ${user.role}</p>
    `;
}

// Récupérer les emprunts de l'utilisateur
async function fetchEmprunts() {
    if (!currentUserId) return;
    const response = await fetch(`/api/mes-emprunts?adherent_id=${currentUserId}`);
    const emprunts = await response.json();
    return emprunts;
}

// Afficher les emprunts dans le tableau
async function displayEmprunts() {
    const emprunts = await fetchEmprunts();
    const tbody = document.getElementById("empruntsTable");
    tbody.innerHTML = "";

    emprunts.forEach(e =>    {}
        const tr = document.createElement("tr");
        tr.className = "border-t";

        
        let statutColor = "text-gray-700";
        if (e.statut === "en_retard") statutColor = "text-red-600 font-bold";
        if (e.statut === "rendu") statutColor = "text-green-600";

        tr.innerHTML = `
            <td class="px-4 py-2">${e.titre}</td>
            <td class="px-4 py-2">${new Date(e.date_emprunt).toLocaleDateString()}</td>
            <td class="px-4 py-2">${new Date(e.date_retour_prevue).toLocaleDateString()}</td>
            <td class="px-4 py-2 ${statutColor}">${e.statut}</td>
        `;
        tbody.appendChild(tr);
    });
}


async function init() {
    await fetchCurrentUser();
    await displayEmprunts();
}
init();
</script>

</body>
</html>
