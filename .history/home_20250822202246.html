<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Home - Bibliothèque</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #searchInput {
            width: 300px;
            padding: 8px;
            margin-bottom: 20px;
        }
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }
        .book-card {
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }
        .book-card img {
            width: 150px;
            height: 200px;
            object-fit: cover;
            margin-bottom: 10px;
        }
        .book-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .book-status {
            margin-bottom: 10px;
            padding: 5px;
            border-radius: 3px;
            color: white;
        }
        .disponible {
            background-color: green;
        }
        .reserve {
            background-color: red;
        }
        .book-card button {
            padding: 5px 10px;
            cursor: pointer;
        }
        .book-card button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }
    </style>
</head>
<body>

<h1>Bienvenue à la bibliothèque</h1>
<input type="text" id="searchInput" placeholder="Rechercher un livre...">

<div id="booksGrid" class="books-grid"></div>

<script>
async function fetchBooks(search="") {
    try {
        let url = "/api/livres";
        if (search) url += `?search=${encodeURIComponent(search)}`;
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const livres = await response.json();
        return livres;
    } catch (err) {
        console.error("Erreur fetchBooks:", err);
        return [];
    }
}

async function displayBooks(search="") {
    const books = await fetchBooks(search);
    const grid = document.getElementById("booksGrid");
    grid.innerHTML = "";

    if (books.length === 0) {
        grid.innerHTML = "<p>Aucun livre trouvé.</p>";
        return;
    }

    books.forEach(book => {
        const card = document.createElement("div");
        card.className = "book-card";
        card.innerHTML = `
            <img src="${book.image_url || 'https://via.placeholder.com/150'}" alt="${book.titre}">
            <div class="book-title">${book.titre}</div>
            <div class="book-status ${book.disponibilite ? 'disponible' : 'reserve'}">
                ${book.disponibilite ? 'Disponible' : 'Réservé'}
            </div>
            <button ${!book.disponibilite ? 'disabled' : ''} onclick="reserveBook(${book.id})">
                Réserver
            </button>
        `;
        grid.appendChild(card);
    });
}

async function reserveBook(bookId) {
    try {
        const response = await fetch("/api/reservations", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id_livre: bookId, id_adherent: 1 }) // Remplace 1 par l'id réel de l'adhérent connecté
        });
        const result = await response.json();
        alert(result.msg);
        displayBooks(); // Rafraîchir la liste
    } catch (err) {
        console.error("Erreur réservation:", err);
        alert("Erreur lors de la réservation.");
    }
}

// Recherche dynamique
document.getElementById("searchInput").addEventListener("input", (e) => {
    displayBooks(e.target.value);
});

// Affichage initial
displayBooks();
</script>

</body>
</html>
