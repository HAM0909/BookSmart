<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />

<body class="bg-gray-100 p-6 font-sans">
    <h1 class="text-3xl text-center mb-8 text-blue-700">
        Réserver un livre
    </h1>
     <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow border border-gray-200">
        <label for="bookId" class="block text-sm font-medium text-gray-700 mb-2">
         ID du livre
        </label>
        <input type="number" id="bookId" value="1"
        class="w-full border border-gray-300 rounded px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">

        <label for="memberId" class="block text-sm font-medium text-gray-700 mb-2">
          ID de l'adhérent
        </label>
        <input type="number" id="memberId" value="1"
               class="w-full border border-gray-300 rounded px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">

        <button id="reserveBtn" onclick="makeReservation()"
           class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded font-medium transition duration-200">
     Réserver
   </button>
    </div>
    <script>
        // Main reservation function - this handles the actual booking logic
        function makeReservation() {
            // Grab our DOM elements
            const bookInput = document.getElementById("bookId");
            const memberInput = document.getElementById("memberId");
            const reserveButton = document.getElementById("reserveBtn");
            // Get value from inputs
            let bookIdValue = bookInput.value;
            let memberIdValue = memberInput.value;
            // Simple validation (could improve later...)
            if (!bookIdValue || !memberIdValue) {
                alert("Please complete both fields!");
                return;
            }
